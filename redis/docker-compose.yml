services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - yes
      - --save
      - "60"
      - "1000"
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - allkeys-lru

    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - ewms-net

volumes:
  redis_data:

# ── Network Configuration ──────────────────────────────────────
networks:
  ewms-net:
    external: true
    name: ewms-network