services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis
    restart: unless-stopped

    ports:
      - "6379:6379"
    
    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - ewms-net

volumes:
  redis_data:

# ── Network Configuration ──────────────────────────────────────
networks:
  ewms-net:
    external: true
    name: ewms-network