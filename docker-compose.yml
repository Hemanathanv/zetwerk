x-backend-env: &backend-env
  env_file:
    - ./backend/.env
  environment:
    RUN_OCR_WORKERS_IN_API: "false"
    DATABASE_URL: ${DATABASE_URL:-postgresql://ewms-postgres:ewms%40%232026%21@postgres:5432/ewms_db}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
    KEYCLOAK_URL: ${KEYCLOAK_URL:-http://ewms-keycloak:8080/keycloak}

services:
  views-init:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend-api
      secrets:
        - backend_env
    image: zetwerk-backend-api:local
    <<: *backend-env
    command: ["python", "scripts/ensure_views.py"]
    restart: "no"
    networks:
      - ewms-net

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend-api
      secrets:
        - backend_env
    image: zetwerk-backend-api:local
    <<: *backend-env
    depends_on:
      views-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8120}:8120"
    restart: unless-stopped
    networks:
      - ewms-net

  upload-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.upload_service
      secrets:
        - backend_env
    image: zetwerk-upload-service:local
    <<: *backend-env
    depends_on:
      views-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - ewms-net

  detect-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.detect_ocr
      secrets:
        - backend_env
    image: zetwerk-detect-ocr:local
    <<: *backend-env
    depends_on:
      views-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - ewms-net

  ocr-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.ocr_service
      secrets:
        - backend_env
    image: zetwerk-ocr-service:local
    <<: *backend-env
    depends_on:
      views-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - ewms-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_BACKEND_API_BASE: ${VITE_BACKEND_API_BASE:-}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-/keycloak}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-ewms-saas}
    image: zetwerk-frontend:local
    depends_on:
      - backend-api
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped
    networks:
      - ewms-net

networks:
  ewms-net:
    external: true
    name: ewms-network

secrets:
  backend_env:
    file: ./backend/.env
