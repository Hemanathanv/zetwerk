x-backend-env: &backend-env
  env_file:
    - ./backend/.env
  environment:
    RUN_OCR_WORKERS_IN_API: "false"
    DATABASE_URL: ${DATABASE_URL:-postgresql://ewms-postgres:ewms%40%232026%21@postgres:5432/ewms-db}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    KEYCLOAK_URL: http://ewms-keycloak:8080/keycloak
    TASK_ENGINE_DEBUG: ${TASK_ENGINE_DEBUG:-false}

x-backend-image: &backend-image
  build:
    context: ./backend
    dockerfile: Dockerfile.backend-api
    secrets:
      - backend_env
  image: zetwerk-backend:local

x-backend-depends-api: &backend-depends-api
  depends_on:
    backend-api:
      condition: service_healthy

services:
  backend-api:
    <<: [*backend-image, *backend-env]
    command: ["sh", "-c", "python scripts/ensure_views.py && exec uvicorn app:app --host 0.0.0.0 --port 8120"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8120/api/docs >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "${BACKEND_PORT:-8120}:8120"
    restart: unless-stopped
    networks:
      - ewms-net

  upload-worker:
    <<: [*backend-image, *backend-env, *backend-depends-api]
    command: ["python", "-m", "documents_ocr.workers", "upload_worker"]
    restart: unless-stopped
    networks:
      - ewms-net

  drive-worker:
    <<: [*backend-image, *backend-env]
    environment:
      RUN_OCR_WORKERS_IN_API: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql://ewms-postgres:ewms%40%232026%21@postgres:5432/ewms-db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      KEYCLOAK_URL: http://ewms-keycloak:8080/keycloak
      TASK_ENGINE_DEBUG: ${TASK_ENGINE_DEBUG:-false}
      DRIVE_DOC_TYPE: ${DRIVE_DOC_TYPE:-SALES_INVOICE}
      DRIVE_SOURCE_FOLDER_ID: ${DRIVE_SOURCE_FOLDER_ID:-1IRjTYGPde8LBD1jJVfDUzRmO62cnu3G3}
      DRIVE_PROCESSED_FOLDER_ID: ${DRIVE_PROCESSED_FOLDER_ID:-}
      DRIVE_POLL_INTERVAL_SECONDS: ${DRIVE_POLL_INTERVAL_SECONDS:-3600}
      DRIVE_UPLOADED_BY: ${DRIVE_UPLOADED_BY:-drive-worker}
    command: ["python", "-m", "drive_worker.drive_worker"]
    depends_on:
      backend-api:
        condition: service_healthy
      upload-worker:
        condition: service_started
      ocr-worker:
        condition: service_started
    restart: unless-stopped
    networks:
      - ewms-net

  detect-worker:
    <<: [*backend-image, *backend-env, *backend-depends-api]
    command: ["python", "-m", "documents_ocr.workers", "detect_worker"]
    restart: unless-stopped
    networks:
      - ewms-net

  ocr-worker:
    <<: [*backend-image, *backend-env, *backend-depends-api]
    command: ["python", "-m", "documents_ocr.workers", "ocr_worker"]
    restart: unless-stopped
    networks:
      - ewms-net

  sqs-zata-worker:
    <<: [*backend-image, *backend-env, *backend-depends-api]
    command: ["python", "sqs_worker.py"]
    restart: unless-stopped
    networks:
      - ewms-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_BACKEND_API_BASE: ${VITE_BACKEND_API_BASE:-}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-/keycloak}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-ewms-saas}
    image: zetwerk-frontend:local
    depends_on:
      - backend-api
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped
    networks:
      - ewms-net

networks:
  ewms-net:
    external: true
    name: ewms-network

secrets:
  backend_env:
    file: ./backend/.env
