# Paste these lines into the Nginx Proxy Manager "Advanced" tab
# for the frontend proxy host that points to frontend:5173.
#
# Install ewms-maintenance.html inside the NPM container at:
# /data/nginx/maintenance/ewms-maintenance.html

proxy_intercept_errors on;
error_page 500 502 503 504 =503 /ewms-maintenance.html;

location = /ewms-maintenance.html {
  internal;
  root /data/nginx/maintenance;
  default_type text/html;
  add_header Cache-Control "no-store" always;
}
